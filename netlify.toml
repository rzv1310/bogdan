# Netlify serves the no-trailing-slash form by default (pretty URLs), so no
# explicit trailing-slash redirect is needed here.

[build.processing.html]
  pretty_urls = false

# SPA fallback for client-side routes. Real 404s are served by dist/404.html
# with a 404 status because this rewrite only applies when no file matches
# and the requested path is a known SPA route prefix.
[[redirects]]
from = "/servicii/*"
to = "/index.html"
status = 200

[[redirects]]
from = "/en/*"
to = "/index.html"
status = 200
